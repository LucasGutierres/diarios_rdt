<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diários do Rio das Trevas</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="images/rio-das-trevas_Prancheta 1 cópia 3.ico">
    <style>
        @font-face{
            font-family: Averta;
            src: url("AvertaDemoPE-ExtraBold.otf");
        }

        body {
            font-family: 'Lato', sans-serif;
            color: white;
        }

        .diary {
            display: flex;
            align-items: center;
            flex-direction: column;
            margin-top: 5vh;
            background-color: rgba(45, 10, 20, 0.8);
            width: 90%;
            max-width: 800px;
            min-height: 50vh;
            height: auto;
            max-height: 80vh;
            margin-left: auto;
            margin-right: auto;
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .diary h2 {
            font-family: Averta, sans-serif;
            font-size: 24px;
            margin-bottom: 12px;
            text-align: center;
            width: 100%;
        }

        .diary h3 {
            font-family: Averta, sans-serif;
            font-size: 19px;
            margin-top: 15px;
            margin-bottom: 8px;
            text-align: justify;
            width: 100%;
            color: #dddddd;
        }

        .diary p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 12px;
            text-align: justify;
            width: 100%;
        }

        .dropdown {
            margin-top: 5vh;
            position: relative;
            margin-left: auto;
            margin-right: auto;
            width: 90%;
            max-width: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-style: italic;
            font-size: 25px;
        }

        .dropbtn {
            width: 0;
            height: 0;
            padding: 0;
            background: transparent;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid white;
            border-bottom: none;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .dropdown-content {
          display: none;
          position: absolute;
          top: 100%;
          left: 50%;
          transform: translateX(-50%);
          background-color: #f9f9f9;
          font-style: normal;
          min-width: 200px;
          box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
          z-index: 2;
          max-height: 200px;
          overflow-y: auto;
          border-radius: 4px;
        }

        .dropdown-content a {
            font-size: 12px;
          color: black;
          padding: 12px 16px;
          text-decoration: none;
          display: block;
        }

        .dropdown-content a:hover {
          background-color: #f1f1f1
        }

        .dropdown.show .dropdown-content {
          display: block;
        }

        .dropdown.show .dropbtn {
          transform: rotate(180deg);
        }

    </style>
</head>
<body style="background-image: url('images/rj_fundo_rdt.png'); background-size: cover; background-color: rgba(15, 15, 15, 0.4); background-blend-mode: multiply;">
    <div style="display: flex; justify-content: center; align-items: center; flex-direction: column; padding-top: 5vh;">
        <p style="font-family: Averta; text-align: center; color: white; font-size: 28px;">Diários dos Jogadores</p>
        <img src="images/rio-das-trevas-02_Prancheta 1 cópia 5.png" style="width: 80px; max-width: 20%;">
    </div>
    <div id="myDropdown" class="dropdown" style="cursor: pointer;">
        <p>Selecione a Data</p>
      <button class="dropbtn"></button>
      <div class="dropdown-content">
        <a href="#" data-file="Abril2026.txt">Abril</a>
        <a href="#" data-file="Maio2026.txt">Maio</a>
        <a href="#" data-file="Junho2026.txt">Junho</a>
      </div>
    </div>
    <div id="diary-box" class="diary">
        <p>Selecione uma data acima para ver os registros das mesas daquele mês.</p>
    </div>
    <script>
        const dropdown = document.getElementById("myDropdown");
        const diaryBox = document.getElementById("diary-box");

        dropdown.addEventListener("click", function(event) {
            event.stopPropagation(); 
            this.classList.toggle("show");
        });

        dropdown.querySelector(".dropdown-content").addEventListener("click", function(event) {
            if (event.target.tagName === 'A') {
                event.preventDefault();
                
                const fileName = event.target.getAttribute("data-file");
                
                if (fileName) {
                    loadDiaryFile(fileName);
                }
            }
        });

        window.addEventListener("click", function() {
            if (dropdown.classList.contains("show")) {
                dropdown.classList.remove("show");
            }
        });

        function loadDiaryFile(fileUrl) {
            fetch(fileUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Could not find or load file: " + fileUrl);
                    }
                    return response.text();
                })
                .then(textData => {
                    const lines = textData.split(/\r?\n/);
                    
                    let htmlOutput = "";
                    
                    lines.forEach(line => {
                        if (line.includes("[titulo]")) {
                            const titleText = line.split("[titulo]")[1].trim();
                            htmlOutput += `<h2>${titleText}</h2>`;
                        }
                        else if (line.includes("[subtitulo]")) {
                            const subtitleText = line.split("[subtitulo]")[1].trim();
                            if (subtitleText) {
                                htmlOutput += `<h3>${subtitleText}</h3>`;
                            }
                        }
                        else if (line.includes("[item]")) {
                            const itemText = line.split("[item]")[1].trim();
                            if (itemText) {
                                htmlOutput += `<p>${itemText}</p>`;
                            }
                        }
                    });
                    diaryBox.innerHTML = htmlOutput || "<p>O arquivo está vazio ou mal formatado.</p>";
                })
                .catch(error => {
                    console.error(error);
                    diaryBox.innerHTML = `<p style="color: red; text-align:center;">Erro ao carregar o arquivo "${fileUrl}". Verifique se o arquivo está na mesma pasta.</p>`;
                });
        }
    </script>
</body>
</html>
